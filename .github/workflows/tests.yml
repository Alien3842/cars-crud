name: Cars CRUD Tests

# 1. 触发条件：PR 到 main 触发测试；push 到 main 触发测试+发布
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 2. 权限：只给读取代码的权限
permissions:
  contents: read

jobs:
  tests:
    # 3. 运行环境：Ubuntu 最新版
    runs-on: ubuntu-latest

    steps:
      # 4. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 5. 设置 Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 6. 安装 Python 依赖
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 7. 安装 Playwright Chromium 及其 Linux 依赖
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 8. 运行四个测试分组（分开执行，方便查错）
      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run integration tests
        run: python -m pytest tests/integration -q

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Run E2E tests
        run: python -m pytest tests/e2e -q

  # 9. 新增的发布任务
  publish:
    needs: tests               # 必须等 tests 任务全部成功才运行
    # 只有在 push 到 main 分支时才运行，PR 阶段绝不碰 Docker Hub 凭证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:${{ github.sha }}