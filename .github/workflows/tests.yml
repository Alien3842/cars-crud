name: Cars CRUD Tests

# 1. 触发条件：当有针对 main 分支的 Pull Request 时触发（包含新提交）
on:
  pull_request:
    branches: [main]

# 2. 权限：只给读取代码的权限
permissions:
  contents: read

jobs:
  tests:
    # 3. 运行环境：Ubuntu 最新版
    runs-on: ubuntu-latest

    steps:
      # 4. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 5. 设置 Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 6. 安装 Python 依赖
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 7. 安装 Playwright Chromium 及其 Linux 依赖
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 8. 运行四个测试分组（分开执行，方便查错）
      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run integration tests
        run: python -m pytest tests/integration -q

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Run E2E tests
        run: python -m pytest tests/e2e -q